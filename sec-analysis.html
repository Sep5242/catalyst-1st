<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catalyst 1st | SEC Analysis</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{font:16px system-ui,Arial,sans-serif;background:#0d1727;color:#edf5ff;margin:0}header{padding:24px;background:#182a40}h1{color:#72e2c3;margin:0 0 8px}main{max-width:1050px;margin:auto;padding:18px}a{color:#8bc9ff}button,select,input{font:inherit;padding:10px;border-radius:8px;border:1px solid #789;background:#253c55;color:#fff}button{cursor:pointer}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.item{background:#1d3048;padding:15px;border-radius:12px;margin:12px 0;border:1px solid #43576c}.item h3{margin:0 0 7px}.muted{color:#bacbdf}.tag{display:inline-block;border:1px solid #789;border-radius:12px;padding:3px 9px;margin-right:7px;font-size:13px}.high{color:#ffce7d}.medium{color:#a3e6ff}.low{color:#c4d0de}.notice{border-left:4px solid #e2b96e;padding:10px 15px;background:#283448}small{color:#bbcadb}#status{min-height:24px}</style></head>
<body><header><h1>CATALYST 1ST — SEC Research</h1><div>Filing priorities and evidence</div><p><a href="./">← Return to main dashboard</a></p></header>
<main><div class="notice">Research priority comes from the filing type. Phrase matches can refer to past events or routine disclosures. Open the original filing to check the date and context.</div>
<div class="controls"><button id="refresh">Refresh SEC filings</button><input id="search" placeholder="Filter ticker/company" aria-label="Filter ticker or company"><select id="priority" aria-label="Filter priority"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select></div><div id="status" role="status"></div><div id="results"></div></main>
<script>
let filings=[];
let analysisByAccession = new Map();
let analysisStatus = "";
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function classify(form){const f=String(form||'').toUpperCase();if(f==='8-K'||f==='6-K')return {priority:'High',type:'Current event disclosure',why:'Review the filing items for earnings, contracts, acquisitions, financing or other material events. Significance and direction are unverified.'};if(f==='10-Q'||f==='10-K'||f==='20-F')return {priority:'Medium',type:'Financial report',why:'Review results, guidance, liquidity, risks and changes versus prior periods.'};if(f.startsWith('S-')||f.includes('424B')||f==='F-3')return {priority:'High',type:'Securities offering / registration',why:'Check for dilution, financing terms and changes in share count. May be negative or neutral.'};if(f==='4')return {priority:'Medium',type:'Insider transaction',why:'Review transaction codes, ownership changes and whether sales are planned.'};return {priority:'Low',type:'Other SEC filing',why:'Read the filing to determine whether any material catalyst exists.'}}
function renderEvidence(filing) {
  const analysis = analysisByAccession.get(filing.accession);
  if (!analysis) return '<p class="muted">Filing evidence unavailable.</p>';
  const signals = Array.isArray(analysis.signals) ? analysis.signals : [];
  if (!signals.length) {
    const message = analysis.status === 'Analyzed' ? 'No tracked phrases matched.' : analysis.status;
    return `<p class="muted">${esc(message || 'Filing evidence unavailable.')}</p>`;
  }
  const matches = signals.map(signal => {
    const excerpts = Array.isArray(signal.excerpts) ? signal.excerpts : [];
    return `<li><strong>${esc(signal.phrase)}</strong> · ${esc(signal.mentions)} match(es)
      ${excerpts.map(excerpt => `<blockquote>${esc(excerpt.replace(/\s+/g, ' ').trim())}</blockquote>`).join('')}
    </li>`;
  }).join('');
  return `<details><summary>Filing evidence · ${signals.length} matched phrase(s)</summary><ul>${matches}</ul></details>`;
}

function render(){const q=document.getElementById('search').value.trim().toLowerCase(),p=document.getElementById('priority').value;let a=filings.filter(x=>{let c=classify(x.form);return (!p||p===c.priority)&&(!q||String(x.ticker||'').toLowerCase().includes(q)||String(x.company||'').toLowerCase().includes(q))});document.getElementById('status').textContent=`Showing ${a.length} of ${filings.length} filings${analysisStatus}`;document.getElementById('results').innerHTML=a.length?a.map(x=>{let c=classify(x.form),url=String(x.url||'');let link=/^https:\/\/(www\.)?sec\.gov\//i.test(url)?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">Read original SEC filing</a>`:'SEC link unavailable';return `<article class="item"><h3>${esc(x.ticker||'Unknown ticker')} — ${esc(x.company||'')}</h3><span class="tag ${c.priority.toLowerCase()}">${c.priority} research priority</span><span class="tag">${esc(x.form||'Unknown form')}</span><p class="muted">Filed: ${esc(x.filed||'Unknown')} · ${esc(c.type)}</p><p>${esc(c.why)}</p>${link}${renderEvidence(x)}</article>`}).join(''):'<p>No matching filings.</p>'}
async function readFeed(path) {
  const response = await fetch(path, {cache: 'no-store'});
  if (!response.ok) throw new Error('HTTP ' + response.status);
  const data = await response.json();
  if (!Array.isArray(data.filings)) throw new Error('Unexpected JSON format');
  return data.filings;
}

async function load() {
  const status = document.getElementById('status');
  const refresh = document.getElementById('refresh');
  status.textContent = 'Loading SEC filings…';
  refresh.disabled = true;
  try {
    const [feed, analysis] = await Promise.allSettled([
      readFeed('./data/sec-catalysts.json'),
      readFeed('./data/sec-analysis.json')
    ]);
    if (feed.status === 'rejected') throw feed.reason;
    filings = feed.value;
    analysisByAccession = new Map();
    analysisStatus = '';
    if (analysis.status === 'fulfilled') {
      for (const filing of analysis.value) {
        if (filing.accession) analysisByAccession.set(filing.accession, filing);
      }
    } else {
      analysisStatus = ' · Filing evidence unavailable';
    }
    render();
  } catch (error) {
    filings = [];
    analysisByAccession.clear();
    analysisStatus = '';
    status.textContent = 'Could not load SEC filings: ' + error.message;
    document.getElementById('results').replaceChildren();
  } finally {
    refresh.disabled = false;
  }
}
document.getElementById('refresh').onclick=load;document.getElementById('search').oninput=render;document.getElementById('priority').onchange=render;load();
</script></body></html>

name: BRBR Early Alert Replay

on: workflow_dispatch

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Alpaca bars and replay the alert
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          import subprocess
          from collections import Counter
          from datetime import datetime, timedelta
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          eastern = ZoneInfo("America/New_York")
          headers = {
              "APCA-API-KEY-ID": os.environ["APCA_API_KEY_ID"],
              "APCA-API-SECRET-KEY": os.environ["APCA_API_SECRET_KEY"],
          }

          def fetch_bars(timeframe, start, end):
              params = {
                  "symbols": "BRBR",
                  "timeframe": timeframe,
                  "start": start,
                  "end": end,
                  "feed": "iex",
                  "adjustment": "raw",
                  "limit": 10000,
              }
              while True:
                  url = "https://data.alpaca.markets/v2/stocks/bars?"
                  request = Request(url + urlencode(params), headers=headers)
                  try:
                      with urlopen(request, timeout=30) as response:
                          page = json.load(response)
                  except HTTPError as error:
                      raise SystemExit(f"Alpaca returned HTTP {error.code}.")
                  yield from (page.get("bars") or {}).get("BRBR", [])
                  token = page.get("next_page_token")
                  if not token:
                      return
                  params["page_token"] = token

          def local_time(bar):
              return datetime.fromisoformat(
                  bar["t"].replace("Z", "+00:00")
              ).astimezone(eastern)

          daily = list(fetch_bars("1Day", "2026-11-16", "2026-11-21"))
          if not daily:
              raise SystemExit("Alpaca returned no BRBR daily bars.")
          print("Daily IEX bars for checking the gap date:", flush=True)
          for bar in daily:
              print(f"{local_time(bar).date()}  Open ${bar['o']:.2f}"
                    f"  Close ${bar['c']:.2f}", flush=True)

          counts = Counter()
          with open("brbr-bars.csv", "w", newline="") as output:
              writer = csv.writer(output)
              writer.writerow(["bar_end", "close", "volume"])
              for bar in fetch_bars(
                  "5Min", "2026-09-01", "2026-11-17T21:00:00Z"
              ):
                  start = local_time(bar)
                  minute = start.hour * 60 + start.minute
                  if 570 <= minute < 960:
                      end = start + timedelta(minutes=5)
                      writer.writerow([end.isoformat(), bar["c"], bar["v"]])
                      counts[start.date().isoformat()] += 1

          test_count = counts["2026-11-17"]
          if not test_count:
              raise SystemExit("No regular-session bars for November 17.")
          full_baselines = sum(
              count == 78 for day, count in counts.items() if day < "2026-11-17"
          )
          print(f"November 17 coverage: {test_count}/78 bars. "
                f"Prior sessions with all 78 bars: {full_baselines}.", flush=True)
          if test_count < 78 or full_baselines < 20:
              print("Missing IEX bars can make a no-alert result inconclusive.",
                    flush=True)
          import json
          from pathlib import Path
          from statistics import mean

          events = [{
              "title": "BellRing Q4 and FY2026 earnings and FY2027 outlook",
              "published_at": "2026-10-27T17:00:00-04:00",
              "scheduled_at": "2026-11-18T07:00:00-05:00",
              "source_url": "https://www.globenewswire.com/news-release/2026/10/27/3389705/0/en/bellring-brands-announces-timing-of-fourth-quarter-and-fiscal-year-2026-earnings-release-and-conference-call.html",
          }]
          Path("brbr-events.json").write_text(json.dumps(events))
          news_cutoff = datetime.fromisoformat("2026-11-17T13:40:00-05:00")
          news_params = {
              "symbols": "BRBR",
              "start": "2026-10-27T00:00:00-04:00",
              "end": news_cutoff.isoformat(),
              "limit": 50,
              "include_content": "true",
          }
          recent_news = []
          earnings_source_found = False

          while True:
              news_url = "https://data.alpaca.markets/v1beta1/news?"
              news_request = Request(
                  news_url + urlencode(news_params), headers=headers
              )
              try:
                  with urlopen(news_request, timeout=30) as response:
                      news_page = json.load(response)
              except HTTPError as error:
                  raise SystemExit(f"Alpaca news returned HTTP {error.code}.")

              for article in news_page.get("news") or []:
                  published = datetime.fromisoformat(article["created_at"])
                  updated = datetime.fromisoformat(
                      article.get("updated_at") or article["created_at"]
                  )
                  if published > news_cutoff or updated > news_cutoff:
                      continue

                  source_url = article.get("url")
                  if source_url == events[0]["source_url"]:
                      earnings_source_found = True
                      events[0]["published_at"] = published.isoformat()
                      import re
                      from html import unescape

                      article_text = " ".join(
                          unescape(re.sub(r"<[^>]+>", " ", article.get(field) or ""))
                          for field in ("summary", "content")
                      )
                      release = re.search(
                          r"\b([A-Za-z]+ \d{1,2}, \d{4})\s+at\s+"
                          r"(\d{1,2}:\d{2})\s*([ap])\.?m\.?\s+(?:ET|EST|EDT)\b",
                          article_text,
                          flags=re.IGNORECASE,
                      )
                      if release is None:
                          raise SystemExit(
                              "Could not read the earnings release time from Alpaca's article."
                          )
                      date_text, clock_text, period = release.groups()
                      release_time = datetime.strptime(
                          f"{date_text} {clock_text} {period.upper()}M",
                          "%B %d, %Y %I:%M %p",
                      ).replace(tzinfo=eastern)
                      events[0]["scheduled_at"] = release_time.isoformat()
                      print(f"Earnings release extracted: {release_time.isoformat()}",
                            flush=True)
                  elif published >= news_cutoff - timedelta(days=7):
                      recent_news.append({
                          "title": article["headline"],
                          "published_at": published.isoformat(),
                          "source_url": source_url,
                      })

              token = news_page.get("next_page_token")
              if not token:
                  break
              news_params["page_token"] = token

          Path("brbr-events.json").write_text(json.dumps(events))
          print(f"Original earnings announcement found in Alpaca: "
                f"{earnings_source_found}", flush=True)
          print("Recent BRBR news available before the historical alert:",
                flush=True)
          print(json.dumps(recent_news, indent=2), flush=True)
          volumes = {}
          with open("brbr-bars.csv", newline="") as bar_file:
              for row in csv.DictReader(bar_file):
                  bar_end = datetime.fromisoformat(row["bar_end"])
                  volumes.setdefault(bar_end.date(), {})[bar_end.time()] = int(
                      row["volume"]
                  )

          test_day = datetime(2026, 11, 17).date()
          prior_days = sorted(day for day in volumes if day < test_day)
          session_open = datetime(2026, 11, 17, 9, 30, tzinfo=eastern)

          print("BRBR cumulative volume progression (ET):", flush=True)
          for hour, minute in [(10, 30), (12, 0), (13, 0), (13, 40)]:
              checkpoint = session_open.replace(hour=hour, minute=minute)
              bar_count = (checkpoint - session_open) // timedelta(minutes=5)
              bar_times = [
                  (session_open + timedelta(minutes=5 * index)).time()
                  for index in range(1, bar_count + 1)
              ]
              baseline = [
                  sum(volumes[day][bar] for bar in bar_times)
                  for day in prior_days
                  if all(bar in volumes[day] for bar in bar_times)
              ][-20:]
              current = volumes[test_day]
              label = checkpoint.strftime("%I:%M %p").lstrip("0")
              if len(baseline) < 20 or not sum(baseline) or any(
                  bar not in current for bar in bar_times
              ):
                  print(f"{label}: insufficient bar coverage", flush=True)
                  continue
              total = sum(current[bar] for bar in bar_times)
              average = mean(baseline)
              print(
                  f"{label}: {total:,} shares vs. {average:,.0f} average "
                  f"({total / average:.3f}x RVOL)",
                  flush=True,
              )
          subprocess.run([
              "python3", "replay_early_alert.py", "brbr-bars.csv",
              "--level", "11.00",
              "--from", "2026-11-17T09:30:00-05:00",
              "--through", "2026-11-17T16:00:00-05:00",
              "--baseline-sessions", "20",
              "--rvol", "1.3",
              "--events", "brbr-events.json",
          ], check=True)
          PY

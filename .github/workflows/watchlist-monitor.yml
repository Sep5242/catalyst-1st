name: Watchlist Monitor

on:
  schedule:
    - cron: '37,52 9 * * 1-5'
      timezone: 'America/New_York'
    - cron: '7,22,37,52 10-15 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      ticker:
        description: "Stock ticker to check"
        required: true
        default: "AAPL"
        type: string
      watch_price:
        description: "Watch price in dollars (optional)"
        required: false
        type: string
      send_test_email:
        description: "Send a labeled test email using sample data"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the latest Alpaca IEX minute bar
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.send_test_email) }}
        env:
          WATCH_TICKER: ${{ github.event_name == 'schedule' && vars.MONITOR_TICKER || inputs.ticker }}
          WATCH_PRICE: ${{ github.event_name == 'schedule' && vars.MONITOR_WATCH_PRICE || inputs.watch_price }}
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          ticker = os.environ["WATCH_TICKER"].strip().upper()
          if not re.fullmatch(r"[A-Z][A-Z0-9.-]{0,14}", ticker):
              raise SystemExit("Enter one stock ticker, such as AAPL.")

          key_id = os.environ["APCA_API_KEY_ID"]
          secret_key = os.environ["APCA_API_SECRET_KEY"]
          if not key_id or not secret_key:
              raise SystemExit("The Alpaca GitHub Actions secrets are missing.")

          request = Request(
              f"https://data.alpaca.markets/v2/stocks/{ticker}/bars/latest?feed=iex",
              headers={
                  "APCA-API-KEY-ID": key_id,
                  "APCA-API-SECRET-KEY": secret_key,
              },
          )

          try:
              with urlopen(request, timeout=20) as response:
                  bar = json.load(response).get("bar")
          except HTTPError as error:
              raise SystemExit(f"Alpaca returned HTTP {error.code} for {ticker}.")
          except (URLError, TimeoutError):
              raise SystemExit("Could not reach Alpaca or the request timed out.")

          if not isinstance(bar, dict) or any(
              bar.get(field) is None for field in ("t", "c", "v")
          ):
              raise SystemExit(f"Alpaca returned no complete IEX bar for {ticker}.")

          bar_start = datetime.fromisoformat(bar["t"].replace("Z", "+00:00"))
          eastern = bar_start.astimezone(ZoneInfo("America/New_York"))
          age = (datetime.now(timezone.utc) - bar_start).total_seconds() / 60

          print(f"{ticker} | Alpaca IEX | latest one-minute bar")
          print(f"Bar start: {eastern:%Y-%m-%d %I:%M %p %Z} ({age:.1f} minutes ago)")
          print(f"Close: ${bar['c']:.2f} | Volume: {bar['v']:,} shares")
          watch_text = os.environ["WATCH_PRICE"].strip()
          if watch_text:
              from decimal import Decimal

              if not re.fullmatch(r"[0-9]+(?:\.[0-9]+)?", watch_text):
                  raise SystemExit("Enter a positive watch price, such as 350.00.")
              watch_price = Decimal(watch_text)
              if watch_price <= 0:
                  raise SystemExit("Watch price must be greater than zero.")

              close = Decimal(str(bar["c"]))
              lower = watch_price * Decimal("0.98")
              status = "IN RANGE" if lower <= close <= watch_price else "OUTSIDE RANGE"
              print(f"Watch range: ${lower:.2f} to ${watch_price:.2f} | {status}")

          from collections import defaultdict
          from datetime import timedelta
          from statistics import mean
          from urllib.parse import urlencode

          rvol = None
          market_open = eastern.replace(hour=9, minute=30, second=0, microsecond=0)
          market_close = market_open + timedelta(hours=6, minutes=30)
          cutoff = eastern.replace(minute=eastern.minute // 5 * 5, second=0, microsecond=0)

          if not market_open < cutoff <= market_close:
              print("Relative volume: waiting for a completed regular-session five-minute bar.")
          else:
              params = {
                  "symbols": ticker,
                  "timeframe": "5Min",
                  "start": (market_open - timedelta(days=77)).isoformat(),
                  "end": cutoff.isoformat(),
                  "feed": "iex",
                  "adjustment": "raw",
                  "limit": 10000,
              }
              volumes = defaultdict(dict)
              while True:
                  history_request = Request(
                      "https://data.alpaca.markets/v2/stocks/bars?" + urlencode(params),
                      headers=dict(request.header_items()),
                  )
                  with urlopen(history_request, timeout=20) as response:
                      page = json.load(response)
                  for item in (page.get("bars") or {}).get(ticker, []):
                      local = datetime.fromisoformat(
                          item["t"].replace("Z", "+00:00")
                      ).astimezone(eastern.tzinfo)
                      volumes[local.date()][local.time()] = item["v"]
                  token = page.get("next_page_token")
                  if not token:
                      break
                  params["page_token"] = token

              slots = [
                  (market_open + timedelta(minutes=minute)).time()
                  for minute in range(0, int((cutoff - market_open).total_seconds() // 60), 5)
              ]
              current = volumes[cutoff.date()]
              baseline = [
                  sum(volumes[day][slot] for slot in slots)
                  for day in sorted(volumes)
                  if day < cutoff.date() and all(slot in volumes[day] for slot in slots)
              ][-20:]

              if len(baseline) < 20 or not sum(baseline) or not all(slot in current for slot in slots):
                  print("Relative volume: insufficient IEX bar coverage for this comparison.")
              else:
                  rvol = sum(current[slot] for slot in slots) / mean(baseline)
                  result = "MET" if rvol >= 1.30 else "BELOW"
                  print(f"Relative volume through {cutoff:%I:%M %p %Z}: {rvol:.3f}x | 1.30x threshold: {result}")

          if not watch_text or rvol is None:
              print("Setup result: NOT EVALUATED")
          elif status == "IN RANGE" and rvol >= 1.30:
              print("Setup result: SETUP MET")
              if os.environ["GITHUB_EVENT_NAME"] == "schedule" and 0 <= age <= 5:
                  with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as alert:
                      alert.write(
                          f"ALERT_TICKER={ticker}\n"
                          f"ALERT_CLOSE={close:.2f}\n"
                          f"ALERT_RVOL={rvol:.3f}\n"
                          f"ALERT_BAR_TIME={eastern:%Y-%m-%d %I:%M %p %Z}\n"
                      )
          else:
              print("Setup result: NOT MET")
          PY

      - name: Prepare sample watchlist alert
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.send_test_email }}
        run: |
          cat >> "$GITHUB_ENV" <<'EOF'
          ALERT_IS_TEST=1
          ALERT_TICKER=AAPL
          ALERT_CLOSE=100.00
          ALERT_RVOL=1.500
          ALERT_BAR_TIME=Sample data
          EOF

      - name: Email qualifying watchlist setup
        if: ${{ env.ALERT_TICKER != '' }}
        env:
          ALERT_SMTP_USERNAME: ${{ secrets.ALERT_SMTP_USERNAME }}
          ALERT_SMTP_PASSWORD: ${{ secrets.ALERT_SMTP_PASSWORD }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          sender = os.environ["ALERT_SMTP_USERNAME"].strip()
          password = os.environ["ALERT_SMTP_PASSWORD"].strip()
          recipient = os.environ["ALERT_EMAIL_TO"].strip()
          if not all((sender, password, recipient)):
              raise SystemExit("One or more alert email secrets are missing.")

          ticker = os.environ["ALERT_TICKER"]
          is_test = os.environ.get("ALERT_IS_TEST") == "1"
          message = EmailMessage()
          message["From"] = sender
          message["To"] = recipient
          if is_test:
              message["Subject"] = f"Catalyst 1st | TEST ONLY | {ticker}"
              intro = f"Manual delivery test using synthetic data for {ticker}."
          else:
              message["Subject"] = f"Catalyst 1st | {ticker} | SETUP MET"
              intro = f"Watchlist Monitor setup met for {ticker}."

          message.set_content(
              f"{intro}\n"
              f"IEX bar time: {os.environ['ALERT_BAR_TIME']}\n"
              f"Close: ${os.environ['ALERT_CLOSE']}\n"
              f"Relative volume: {os.environ['ALERT_RVOL']}x\n"
              f"Run: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}\n"
          )

          try:
              with smtplib.SMTP("smtp.mail.me.com", 587, timeout=15) as smtp:
                  smtp.starttls(context=ssl.create_default_context())
                  smtp.login(sender, password)
                  smtp.send_message(message)
          except smtplib.SMTPResponseException as error:
              raise SystemExit(f"iCloud SMTP returned status {error.smtp_code}.") from None
          except (smtplib.SMTPException, OSError):
              raise SystemExit("Could not complete the iCloud SMTP send.") from None

          print("iCloud accepted the watchlist email for delivery.")
          PY
